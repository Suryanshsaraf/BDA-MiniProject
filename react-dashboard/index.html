<!DOCTYPE html>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body {
        background-color: #030712;
        color: #f1f5f9;
        font-family: 'Plus Jakarta Sans', sans-serif;
      }

        background: #030712 !important;

        border: 1px solid rgba(99, 102, 241, 0.3);
      }
      .leaflet-popup-tip {

      }
      .leaflet-custom-tooltip {
        background: rgba(15, 23, 42, 0.95) !important;
        border: 1px solid rgba(99, 102, 241, 0.5) !important;
        color: #f8fafc !important;
        border-radius: 8px !important;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7) !important;
        backdrop-filter: blur(8px);
      }
      .leaflet-custom-tooltip:before {
        border-right-color: rgba(15, 23, 42, 0.95) !important;

</head>
<body class="min-h-screen antialiased bg-navy-950 text-slate-100 flex flex-col">
    <div id="root" class="flex-grow flex flex-col"></div>
    <script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

// -----------------------------------------------------------------------------
// CONSTANTS & REGIONAL BOUNDS
// -----------------------------------------------------------------------------
const REGION_BOUNDS = {
  "All India": { bounds: [[8.0, 68.0], [36.0, 97.5]], center: [22.5, 80.0], zoom: 4.8 },
  "Northern": { bounds: [[25.0, 73.0], [36.0, 81.5]], center: [30.5, 77.0], zoom: 6 },
  "Western": { bounds: [[15.0, 68.0], [25.0, 77.5]], center: [20.0, 73.0], zoom: 6 },
  "Central": { bounds: [[17.5, 74.0], [27.0, 84.5]], center: [22.5, 79.5], zoom: 6 },
  "Southern": { bounds: [[8.0, 74.0], [20.0, 84.5]], center: [14.0, 78.5], zoom: 6 },
  "Eastern": { bounds: [[19.0, 81.0], [27.5, 89.5]], center: [23.5, 85.5], zoom: 6 },
  "North-Eastern": { bounds: [[21.5, 89.5], [29.5, 97.5]], center: [25.5, 93.5], zoom: 6.5 }
};

const STATE_NAME_ALIASES = {
  "ANDAMAN AND NICOBAR": "ANDAMAN & NICOBAR ISLANDS",
  "DADRA AND NAGAR HAVELI": "DADRA & NAGAR HAVELI",
  "DAMAN AND DIU": "DAMAN & DIU",
  "JAMMU AND KASHMIR": "JAMMU & KASHMIR",
  "ORISSA": "ODISHA",
  "UTTARANCHAL": "UTTARAKHAND"
};

const resolveStateKey = (name) => {
  if (!name) return "";
  const upper = name.trim().toUpperCase();
  return STATE_NAME_ALIASES[upper] || upper;
};

const BASEMAP_TILES = {
  "ArcGIS Dark": "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",
  "OpenStreetMap": "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  "ArcGIS Satellite": "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  "ArcGIS Street": "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}"
};

// -----------------------------------------------------------------------------
// MAIN APP COMPONENT
// -----------------------------------------------------------------------------
function App() {
  const [activeTab, setActiveTab] = useState("map");
  const [selectedRegion, setSelectedRegion] = useState("All India");
  const [selectedMetric, setSelectedMetric] = useState("total_crimes");
  const [activeBasemap, setActiveBasemap] = useState("ArcGIS Dark");
  const [mapLayerMode, setMapLayerMode] = useState("choropleth"); // "choropleth" or "heatmap"
  const [showHotspots, setShowHotspots] = useState(true);

  // Temporal Time-Travel Player State (2001 - 2022)
  const [timelineYear, setTimelineYear] = useState(2022);
  const [isPlayingTimeline, setIsPlayingTimeline] = useState(false);
  const [playbackSpeed, setPlaybackSpeed] = useState(1);

  // Data States
  const [hotspotsData, setHotspotsData] = useState(null);
  const [regionsData, setRegionsData] = useState(null);
  const [timeData, setTimeData] = useState(null);
  const [trendsData, setTrendsData] = useState(null);
  const [evalData, setEvalData] = useState(null);
  const [geoJsonData, setGeoJsonData] = useState(null);
  const [yearlySnapshots, setYearlySnapshots] = useState(null);
  const [duelData, setDuelData] = useState(null);
  const [liveStreamStats, setLiveStreamStats] = useState(null);
  const [showKafkaModal, setShowKafkaModal] = useState(false);
  const [selectedState, setSelectedState] = useState(null);
  const [loading, setLoading] = useState(true);

  // Live Ticker State
  const [tickerIndex, setTickerIndex] = useState(0);

  // Load Analytical Payloads
  useEffect(() => {
    async function fetchData() {
      try {
        const [hRes, rRes, tRes, trRes, eRes, gRes, ysRes, ddRes, lsRes] = await Promise.all([
          fetch('hotspots.json').then(r => r.json()),
          fetch('regions_data.json').then(r => r.json()),
          fetch('time_patterns.json').then(r => r.json()),
          fetch('crime_trends.json').then(r => r.json()),
          fetch('model_evaluation.json').then(r => r.json()),
          fetch('india_states.json').then(r => r.json()),
          fetch('yearly_state_snapshots.json').then(r => r.json()).catch(() => null),
          fetch('district_duel_data.json').then(r => r.json()).catch(() => null),
          fetch(`live_stream_stats.json?_t=${Date.now()}`).then(r => r.json()).catch(() => null)
        ]);

        setHotspotsData(hRes);
        setRegionsData(rRes);
        setTimeData(tRes);
        setTrendsData(trRes);
        setEvalData(eRes);
        setGeoJsonData(gRes);
        setYearlySnapshots(ysRes);
        setDuelData(ddRes);
        setLiveStreamStats(lsRes);
        setLoading(false);
      } catch (err) {
        console.error("Error loading analytical payloads:", err);
        setLoading(false);
      }
    }
    fetchData();
  }, []);

  // Periodic Real-Time Kafka Stream Poller (1500ms)
  useEffect(() => {
    const streamPoller = setInterval(async () => {
      try {
        const res = await fetch(`live_stream_stats.json?_t=${Date.now()}`);
        if (res.ok) {
          const freshData = await res.json();
          setLiveStreamStats(freshData);
        }
      } catch (err) {
        // silent
      }
    }, 1500);
    return () => clearInterval(streamPoller);
  }, []);

  // Timeline Player Effect
  useEffect(() => {
    let interval = null;
    if (isPlayingTimeline) {
      interval = setInterval(() => {
        setTimelineYear(prev => {
          if (prev >= 2022) {
            setIsPlayingTimeline(false);
            return 2022;
          }
          return prev + 1;
        });
      }, 1200 / playbackSpeed);
    }
    return () => clearInterval(interval);
  }, [isPlayingTimeline, playbackSpeed]);

  // Live Telemetry Rolling Ticker Effect
  useEffect(() => {
    const tickerInterval = setInterval(() => {
      setTickerIndex(prev => prev + 1);
    }, 3500);
    return () => clearInterval(tickerInterval);
  }, []);

  // Real-Time Dynamic Ticker deriving from actual streaming Kafka events & anomalies
  const currentTicker = useMemo(() => {
    if (!liveStreamStats) {
      return { type: "STREAM", text: "KAFKA BROKER: Connecting to streaming ingest cluster..." };
    }
    const anomalies = liveStreamStats.active_anomalies || [];
    const events = liveStreamStats.recent_events || [];

    // Alternately surface detected anomalies and raw Kafka events
    if (anomalies.length > 0 && tickerIndex % 2 === 0) {
      const anom = anomalies[tickerIndex % anomalies.length];
      return {
        type: anom.severity || "CRITICAL",
        text: `STATISTICAL SURGE: ${anom.district} (${anom.state}) • ${anom.current_rate} incidents/hr vs ${anom.baseline_mean} baseline (Z=${anom.z_score})`
      };
    }

    if (events.length > 0) {
      const ev = events[tickerIndex % events.length];
      return {
        type: "LIVE KAFKA",
        text: `[EVENT ${ev.event_id}] Partition [${ev.partition}] Offset ${ev.offset}: ${ev.crime_type} in ${ev.district} (${ev.state}) at ${ev.time_display}`
      };
    }

    return {
      type: "SUCCESS",
      text: `KAFKA STREAM ACTIVE: ${(liveStreamStats.events_per_second || 0).toFixed(1)} ev/s • Consumed: ${(liveStreamStats.total_events_consumed || 5000).toLocaleString()}`
    };
  }, [liveStreamStats, tickerIndex]);

  if (loading) {
    return (
      <div className="flex-grow flex items-center justify-center bg-navy-950 text-slate-300 min-h-screen">
        <div className="text-center space-y-4">
          <div className="w-16 h-16 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
          <p className="text-lg font-bold tracking-wider uppercase text-indigo-400">Initializing National Crime Intelligence Command Center...</p>
          <p className="text-xs text-slate-500">Connecting Apache PySpark Engine • HDFS Parquet Data Lake • Spark MLlib Corridors</p>
        </div>
      </div>
    );
  }

  return (
    <div className="flex-grow flex flex-col min-h-screen bg-navy-950 text-slate-100 font-sans selection:bg-indigo-500 selection:text-white">
      {/* 1. Tactical Telemetry Ticker (Top Bar with Real Live Telemetry) */}
      <div className="bg-navy-900 border-b border-slate-800 px-4 py-1.5 flex items-center justify-between text-xs overflow-hidden">
        <div className="flex items-center gap-3 shrink-0">
          <span className="flex items-center gap-1.5 font-bold tracking-wider uppercase text-slate-300">
            <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
            LIVE KAFKA TELEMETRY
          </span>
          <span className="text-slate-600">|</span>
          <span className="text-slate-300 font-mono text-[11px] hidden sm:inline">
            <span className="text-emerald-400 font-bold">{(liveStreamStats?.events_per_second || 0).toFixed(1)}</span> ev/s
          </span>
          <span className="text-slate-600 hidden sm:inline">|</span>
          <span className="text-slate-300 font-mono text-[11px] hidden md:inline">
            Latency: <span className="text-indigo-400 font-bold">{liveStreamStats?.stream_latency_ms || 14}ms</span>
          </span>
          <span className="text-slate-600 hidden md:inline">|</span>
          <span className="text-slate-300 font-mono text-[11px] hidden lg:inline">
            Consumed: <span className="text-amber-400 font-bold">{liveStreamStats?.total_events_consumed?.toLocaleString() || '5,000'}</span>
          </span>
        </div>

        {/* Real Dynamic Scrolling Incident Banner */}
        <div className="flex items-center gap-2 overflow-hidden mx-4">
          <span className={`text-[10px] font-black px-1.5 py-0.5 rounded uppercase ${
            currentTicker.type === 'CRITICAL' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' :
            currentTicker.type === 'WARNING' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' :
            currentTicker.type === 'SUCCESS' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' :
            'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30'
          }`}>
            {currentTicker.type}
          </span>
          <span className="text-slate-300 truncate font-mono text-[11px]">
            {currentTicker.text}
          </span>
        </div>

        {/* Live Stream Inspector Button */}
        <div className="flex items-center gap-2 shrink-0">
          <button
            onClick={() => setShowKafkaModal(true)}
            className="flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-[10px] uppercase tracking-wider shrink-0 transition shadow-md shadow-indigo-600/30"
          >
            <span>📟</span>
            <span>Inspect Kafka Stream</span>
          </button>
        </div>
      </div>

      {/* 2. Main Executive Header */}
      <header className="bg-navy-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-4">
          <div className="flex items-center space-x-3">
            <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-rose-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
              <span className="text-lg">🇮🇳</span>
            </div>
            <div>
              <div className="flex items-center gap-2">
                <h1 className="text-base sm:text-lg font-extrabold tracking-tight text-white uppercase">
                  National Crime Intelligence Command Center
                </h1>
                <span className="hidden sm:inline text-[10px] font-bold px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                  Big Data MLlib
                </span>
              </div>
              <p className="text-[11px] text-slate-400">
                Official National Crime Records Bureau (NCRB) Analytics & Predictive Threat Framework (2001–2022)
              </p>
            </div>
          </div>

          {/* Navigation Mode Tabs */}
          <nav className="flex space-x-1 bg-navy-950 p-1 rounded-xl border border-slate-800 text-xs">
            {[
              { id: "map", label: "Tactical GIS", icon: "🗺️" },
              { id: "simulation", label: "AI Force Optimizer", icon: "🛡️" },
              { id: "duel", label: "District DNA Duel", icon: "🥊" },
              { id: "analytics", label: "Macro Trends", icon: "📈" },
              { id: "explorer", label: "Dossier Explorer", icon: "📋" }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg font-semibold transition-all ${
                  activeTab === tab.id
                    ? "bg-indigo-600 text-white shadow-md shadow-indigo-600/30"
                    : "text-slate-400 hover:text-slate-200 hover:bg-slate-800/60"
                }`}
              >
                <span>{tab.icon}</span>
                <span>{tab.label}</span>
              </button>
            ))}
          </nav>
        </div>
      </header>

      {/* 3. Main Body */}
      <main className="flex-grow flex flex-col p-4 sm:p-6 max-w-7xl w-full mx-auto space-y-4">
        {activeTab === "map" && (
          <TacticalGISView
            hotspotsData={hotspotsData}
            regionsData={regionsData}
            geoJsonData={geoJsonData}
            yearlySnapshots={yearlySnapshots}
            selectedRegion={selectedRegion}
            setSelectedRegion={setSelectedRegion}
            selectedMetric={selectedMetric}
            setSelectedMetric={setSelectedMetric}
            activeBasemap={activeBasemap}
            setActiveBasemap={setActiveBasemap}
            mapLayerMode={mapLayerMode}
            setMapLayerMode={setMapLayerMode}
            showHotspots={showHotspots}
            setShowHotspots={setShowHotspots}
            timelineYear={timelineYear}
            setTimelineYear={setTimelineYear}
            isPlayingTimeline={isPlayingTimeline}
            setIsPlayingTimeline={setIsPlayingTimeline}
            playbackSpeed={playbackSpeed}
            setPlaybackSpeed={setPlaybackSpeed}
            selectedState={selectedState}
            setSelectedState={setSelectedState}
          />
        )}

        {activeTab === "simulation" && (
          <ForceMultiplierSimulator
            duelData={duelData}
            evalData={evalData}
            hotspotsData={hotspotsData}
          />
        )}

        {activeTab === "duel" && (
          <DistrictDNADuelView duelData={duelData} />
        )}

        {activeTab === "analytics" && (
          <MacroAnalyticsView timeData={timeData} trendsData={trendsData} />
        )}

        {activeTab === "explorer" && (
          <DossierExplorerView duelData={duelData} hotspotsData={hotspotsData} />
        )}
      </main>

      {/* Footer */}
      <footer className="bg-navy-950 border-t border-slate-800/80 py-3 text-center text-xs text-slate-500">
        Apache PySpark 3.5 DataFrame API • HDFS Partitioned Storage • Spark MLlib Random Forest & KMeans (K=15) • Leaflet GIS
      </footer>

      {/* Real-time Kafka Stream Inspector Modal */}
      {showKafkaModal && (
        <KafkaStreamModal
          liveStreamStats={liveStreamStats}
          onClose={() => setShowKafkaModal(false)}
        />
      )}
    </div>
  );
}

// -----------------------------------------------------------------------------
// TAB 1: TACTICAL GIS VIEW WITH TEMPORAL TIME-TRAVEL
// -----------------------------------------------------------------------------
function TacticalGISView({
  hotspotsData,
  regionsData,
  geoJsonData,
  yearlySnapshots,
  selectedRegion,
  setSelectedRegion,
  selectedMetric,
  setSelectedMetric,
  activeBasemap,
  setActiveBasemap,
  mapLayerMode,
  setMapLayerMode,
  showHotspots,
  setShowHotspots,
  timelineYear,
  setTimelineYear,
  isPlayingTimeline,
  setIsPlayingTimeline,
  playbackSpeed,
  setPlaybackSpeed,
  selectedState,
  setSelectedState
}) {
  const mapRef = useRef(null);
  const mapInstanceRef = useRef(null);
  const geoJsonLayerRef = useRef(null);
  const markersLayerRef = useRef(null);
  const tileLayerRef = useRef(null);

  const regionNames = ["All India", "Northern", "Western", "Central", "Southern", "Eastern", "North-Eastern"];

  // Color scale
  const getColor = (value, metric) => {
    if (metric === "violent_pct") {
      return value > 25 ? '#991b1b' : value > 20 ? '#dc2626' : value > 15 ? '#ea580c' : value > 10 ? '#3b82f6' : '#10b981';
    }
    if (metric === "women_crimes") {
      return value > 120000 ? '#701a75' : value > 70000 ? '#a21caf' : value > 30000 ? '#c026d3' : value > 10000 ? '#38bdf8' : '#10b981';
    }
    return value > 1800000 ? '#991b1b' : value > 1000000 ? '#dc2626' : value > 500000 ? '#ea580c' : value > 150000 ? '#3b82f6' : '#10b981';
  };

  // Active snapshot for current timeline year
  const activeYearData = yearlySnapshots ? yearlySnapshots[String(timelineYear)] : null;

  // Initialize Map Once
  useEffect(() => {
    if (!mapRef.current) return;

    if (!mapInstanceRef.current) {
      const map = L.map(mapRef.current, {
        center: [22.5, 80.0],
        zoom: 4.8,
        zoomControl: false,
        preferCanvas: false
      });
      L.control.zoom({ position: 'bottomright' }).addTo(map);
      mapInstanceRef.current = map;

      const handleResize = () => {
        if (mapInstanceRef.current) {
          mapInstanceRef.current.invalidateSize({ animate: false });
        }
      };
      window.addEventListener('resize', handleResize);
      setTimeout(handleResize, 50);
      setTimeout(handleResize, 200);
      setTimeout(handleResize, 500);

      if (window.ResizeObserver) {
        const ro = new ResizeObserver(() => handleResize());
        ro.observe(mapRef.current);
      }
    }
  }, []);

  // Update Layers & Choropleths
  useEffect(() => {
    const map = mapInstanceRef.current;
    if (!map) return;

    map.invalidateSize({ animate: false });

    // Basemap
    if (tileLayerRef.current) {
      map.removeLayer(tileLayerRef.current);
    }
    const tileUrl = BASEMAP_TILES[activeBasemap] || BASEMAP_TILES["ArcGIS Dark"];
    tileLayerRef.current = L.tileLayer(tileUrl, {
      attribution: '&copy; Esri, OpenStreetMap contributors',
      maxZoom: 18,
      minZoom: 3
    }).addTo(map);

    // GeoJSON State Choropleth Layer
    if (geoJsonLayerRef.current) {
      map.removeLayer(geoJsonLayerRef.current);
    }

    if (geoJsonData && regionsData) {
      const stateMap = (activeYearData && activeYearData.states) ? activeYearData.states : regionsData.states;
      const regMap = regionsData.region_map;

      geoJsonLayerRef.current = L.geoJSON(geoJsonData, {
        style: (feature) => {
          const sName = feature.properties.NAME_1 || "";
          const normKey = resolveStateKey(sName);
          const stat = stateMap[normKey] || { total_crimes: 0, violent_pct: 0, women_crimes: 0 };
          const reg = regMap[sName] || regMap[normKey] || "Other";

          const isSelectedRegion = selectedRegion === "All India" || reg === selectedRegion;
          const val = stat[selectedMetric] || 0;

          return {
            fillColor: isSelectedRegion ? getColor(val, selectedMetric) : '#1e293b',
            weight: isSelectedRegion ? 1.8 : 0.8,
            opacity: 1.0,
            color: isSelectedRegion ? '#ffffff' : '#475569',
            fillOpacity: isSelectedRegion ? 0.78 : 0.20
          };
        },
        onEachFeature: (feature, layer) => {
          const sName = feature.properties.NAME_1 || "";
          const normKey = resolveStateKey(sName);
          const stat = stateMap[normKey] || { total_crimes: 0, violent_pct: 0, women_crimes: 0, violent_crimes: 0, property_crimes: 0 };
          const reg = regMap[sName] || regMap[normKey] || "Other";

          layer.on({
            mouseover: (e) => {
              const l = e.target;
              l.setStyle({ weight: 3, color: '#6366f1', fillOpacity: 0.95 });
              l.bringToFront();
            },
            mouseout: (e) => {
              if (geoJsonLayerRef.current) {
                geoJsonLayerRef.current.resetStyle(e.target);

            click: () => {
              setSelectedState({ name: sName, region: reg, year: timelineYear, ...stat });

          layer.bindTooltip(`
            <div style="font-family: 'Plus Jakarta Sans', sans-serif; padding: 4px; font-size: 12px; color: #f8fafc;">

            </div>
          `, { sticky: true, className: 'leaflet-custom-tooltip' });

      }).addTo(map);

      // Fit bounds to selected region
      if (selectedRegion === "All India") {
        if (geoJsonLayerRef.current.getBounds().isValid()) {
          map.fitBounds(geoJsonLayerRef.current.getBounds(), { padding: [25, 25] });

      } else {
        const regionFeatures = geoJsonData.features.filter(f => {
          const sName = f.properties.NAME_1 || "";

    // Danger Corridors Layer
    if (markersLayerRef.current) {
      map.removeLayer(markersLayerRef.current);

    // Pick top hotspots (from year snapshot if available, else static top 50)
    const activeHotspots = (activeYearData && activeYearData.top_districts) ? activeYearData.top_districts : (hotspotsData?.top_50_hotspots || []);

                    <div>IPC: <b className="text-slate-200">{d.total_crimes.toLocaleString()}</b></div>
                    <div>Violent: <b className="text-slate-200">{d.violent_percentage}%</b></div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// TAB 2: AI POLICE FORCE MULTIPLIER & RESOURCE OPTIMIZER ("WHAT-IF" SANDBOX)

function ForceMultiplierSimulator({ duelData, evalData, hotspotsData }) {
  const districts = duelData?.districts || [];
  const [selectedDistrictName, setSelectedDistrictName] = useState(districts[0]?.district || "Bangalore Commr.");

  // Operational Simulation Levers
  const [simPoliceDensity, setSimPoliceDensity] = useState(140); // per lakh
  const [simPatrolSaturation, setSimPatrolSaturation] = useState(55); // %
  const [simResponseTime, setSimResponseTime] = useState(14); // mins
  const [simConvictionRate, setSimConvictionRate] = useState(48); // %
  const [simSurveillance, setSimSurveillance] = useState(40); // %

  const currentDistrict = useMemo(() => {
    return districts.find(d => d.district === selectedDistrictName) || districts[0] || {
      district: "Bangalore Commr.", state: "Karnataka", total_crimes: 386990, crime_rate_per_100k: 412, safety_score: 52.4, population: 8400000
    };
  }, [districts, selectedDistrictName]);

  // Real-time AI Simulation Outcomes
  const simulationResults = useMemo(() => {
    // Feature coefficients derived from Random Forest feature importance
    const deltaPolice = (simPoliceDensity - (currentDistrict.police_per_lakh || 120)) / 100.0;
    const deltaPatrol = (simPatrolSaturation - 45) / 100.0;
    const deltaResponse = ((20 - simResponseTime) / 20.0); // faster is better
    const deltaConviction = (simConvictionRate - (currentDistrict.conviction_rate || 45)) / 100.0;
    const deltaSurveillance = (simSurveillance - 30) / 100.0;

    // Projected Crime Reduction % (Deterrence Effect)
    const crimeDeterrencePct = Math.max(
      2.0,
      Math.min(
        48.0,
        (deltaPolice * 16.0) + (deltaPatrol * 12.0) + (deltaResponse * 10.0) + (deltaConviction * 9.0) + (deltaSurveillance * 7.0) + 12.5
      )
    );

    // Apprehension & Clearance Surge %
    const apprehensionSurgePct = Math.max(
      3.0,
      Math.min(
        55.0,
        (deltaResponse * 18.0) + (deltaSurveillance * 14.0) + (deltaPolice * 10.0) + 14.0
      )
    );

    // Estimated Crimes Prevented Annually
    const baselineAnnual = Math.round(currentDistrict.total_crimes / 14); // annual average
    const incidentsPrevented = Math.round(baselineAnnual * (crimeDeterrencePct / 100.0));

    // New Safety Score
    const newSafetyScore = Math.max(20.0, Math.min(95.0, currentDistrict.safety_score + (crimeDeterrencePct * 0.65)));

    // New Risk Level
    let newRiskLevel = "CONTROLLED";
    if (newSafetyScore < 45) newRiskLevel = "CRITICAL";
    else if (newSafetyScore < 65) newRiskLevel = "ELEVATED";
    else if (newSafetyScore < 80) newRiskLevel = "MODERATE";

    return {
      crimeDeterrencePct: Number(crimeDeterrencePct.toFixed(1)),
      apprehensionSurgePct: Number(apprehensionSurgePct.toFixed(1)),
      incidentsPrevented,
      newSafetyScore: Number(newSafetyScore.toFixed(1)),
      newRiskLevel
    };
  }, [currentDistrict, simPoliceDensity, simPatrolSaturation, simResponseTime, simConvictionRate, simSurveillance]);

  return (
    <div className="space-y-6">
      {/* Sandbox Header Banner */}
      <div className="bg-gradient-to-r from-navy-900 via-indigo-950 to-navy-900 p-6 rounded-2xl border border-indigo-500/30 shadow-2xl">
        <div className="flex flex-wrap items-center justify-between gap-4">
          <div>
            <div className="flex items-center gap-2">
              <span className="text-xl">🛡️</span>
              <h2 className="text-lg font-black text-white uppercase tracking-wider">
                Police Force Multiplier & Resource Allocation Simulator
              </h2>
            </div>
            <p className="text-xs text-slate-300 mt-1 max-w-2xl">
              Simulate operational law enforcement interventions. Adjust tactical levers to forecast real-time crime deterrence, clearance rate surge, and community safety improvement via Spark MLlib Random Forest inference.
            </p>
          </div>

          <div className="flex items-center gap-2">
            <span className="text-xs text-slate-300 font-bold">Target District:</span>
            <select
              value={selectedDistrictName}
              onChange={e => setSelectedDistrictName(e.target.value)}
              className="bg-navy-950 border border-slate-700 text-slate-100 text-xs rounded-lg px-3 py-2 font-bold outline-none focus:ring-2 focus:ring-indigo-500"
            >
              {districts.map(d => (
                <option key={d.district} value={d.district}>{d.district} ({d.state})</option>
              ))}
            </select>
          </div>
        </div>
      </div>

      {/* Grid: Controls vs Real-Time AI Outcomes */}
      <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
        {/* Left Column: Interactive Levers */}
        <div className="lg:col-span-6 bg-navy-900/90 p-5 rounded-2xl border border-slate-800 space-y-5">
          <h3 className="text-xs font-bold text-indigo-400 uppercase tracking-wider flex items-center justify-between">
            <span>Tactical Operational Levers</span>
            <span className="text-slate-400 text-[11px] font-normal">Adjust values to trigger ML inference</span>
          </h3>

          {/* Lever 1 */}
          <div className="space-y-1.5">
            <div className="flex justify-between text-xs">
              <span className="text-slate-300 font-semibold">1. Police Density per Lakh Population:</span>
              <span className="font-mono font-bold text-indigo-300">{simPoliceDensity} officers</span>
            </div>
            <input
              type="range"
              min={60}
              max={300}
              value={simPoliceDensity}
              onChange={e => setSimPoliceDensity(Number(e.target.value))}
              className="w-full accent-indigo-500 cursor-pointer h-2 bg-slate-800 rounded-lg appearance-none"

                  LIVE KAFKA TELEMETRY & STATISTICAL ANOMALY STREAM
                </h3>
                <span className="flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
                  STREAM ACTIVE
                </span>
              </div>
              <p className="text-xs text-slate-400 mt-0.5">
                Topic: <code className="text-indigo-300 font-mono">ncrb.districts.ipc-telemetry</code> • Engine: Apache PySpark Ingestion Pipeline
              </p>
            </div>
          </div>
          <button
            onClick={onClose}
            className="text-slate-400 hover:text-white p-2 rounded-lg hover:bg-slate-800/80 transition text-lg font-bold"
          >
            ✕
          </button>
        </div>

        {/* Live Broker Telemetry Ribbon */}
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 p-4 bg-navy-950/60 border-b border-slate-800 text-xs">
          <div className="bg-navy-900/80 border border-slate-800 p-2.5 rounded-xl">
            <div className="text-slate-400 text-[10px] uppercase font-bold">Throughput Rate</div>
            <div className="text-lg font-mono font-black text-emerald-400 mt-0.5">
              {(liveStreamStats?.events_per_second || 0).toFixed(1)} <span className="text-xs font-normal text-slate-400">ev/sec</span>
            </div>
          </div>
          <div className="bg-navy-900/80 border border-slate-800 p-2.5 rounded-xl">
            <div className="text-slate-400 text-[10px] uppercase font-bold">Stream Ingest Latency</div>
            <div className="text-lg font-mono font-black text-indigo-400 mt-0.5">
              {liveStreamStats?.stream_latency_ms || 14} <span className="text-xs font-normal text-slate-400">ms</span>
            </div>
          </div>
          <div className="bg-navy-900/80 border border-slate-800 p-2.5 rounded-xl">
            <div className="text-slate-400 text-[10px] uppercase font-bold">Total Consumed Events</div>
            <div className="text-lg font-mono font-black text-amber-400 mt-0.5">
              {(liveStreamStats?.total_events_consumed || 5000).toLocaleString()}
            </div>
          </div>
          <div className="bg-navy-900/80 border border-slate-800 p-2.5 rounded-xl">
            <div className="text-slate-400 text-[10px] uppercase font-bold">Broker Partitions</div>
            <div className="text-lg font-mono font-black text-sky-400 mt-0.5">
              {liveStreamStats?.active_broker_partitions || 8} <span className="text-xs font-normal text-slate-400">Active</span>
            </div>
          </div>
        </div>

        {/* Tab navigation */}
        <div className="px-6 pt-3 bg-navy-900 border-b border-slate-800 flex gap-4 text-xs font-bold">
          <button
            onClick={() => setActiveTab("events")}
            className={`pb-2.5 border-b-2 transition flex items-center gap-1.5 ${
              activeTab === "events"
                ? "border-indigo-500 text-indigo-400"
                : "border-transparent text-slate-400 hover:text-slate-200"
            }`}
          >
            <span>📜</span> Live Raw Kafka Events ({recentEvents.length})
          </button>
          <button
            onClick={() => setActiveTab("anomalies")}
            className={`pb-2.5 border-b-2 transition flex items-center gap-1.5 ${
              activeTab === "anomalies"
                ? "border-rose-500 text-rose-400"
                : "border-transparent text-slate-400 hover:text-slate-200"
            }`}
          >
            <span>🚨</span> Z-Score Statistical Anomalies ({activeAnomalies.length})
          </button>
          <button
            onClick={() => setActiveTab("metrics")}
            className={`pb-2.5 border-b-2 transition flex items-center gap-1.5 ${
              activeTab === "metrics"
                ? "border-emerald-500 text-emerald-400"
                : "border-transparent text-slate-400 hover:text-slate-200"
            }`}
          >
            <span>📊</span> Ingestion Breakdown
          </button>
        </div>

        {/* Modal Body */}
        <div className="p-6 overflow-y-auto flex-grow space-y-4 text-xs">
          {activeTab === "events" && (
            <div className="space-y-2 font-mono">
              <div className="flex items-center justify-between text-[11px] text-slate-400 pb-1 border-b border-slate-800/80">
                <span>BUFFER: Circular Window (25 Max) • Continuous ingest from NCRB IPC stream</span>
                <span className="text-emerald-400">● Live Rolling Ingestion</span>
              </div>
              <div className="space-y-1.5">
                {recentEvents.length === 0 ? (
                  <div className="p-6 text-center text-slate-500">Waiting for next Kafka event batch...</div>
                ) : (
                  recentEvents.map((ev, i) => (
                    <div
                      key={ev.event_id || i}
                      className="p-2.5 rounded-lg bg-navy-950 border border-slate-800/80 hover:border-indigo-500/50 transition flex flex-wrap items-center justify-between gap-2"
                    >
                      <div className="flex items-center gap-2">
                        <span className="text-slate-500 text-[11px]">{ev.time_display}</span>
                        <span className="px-1.5 py-0.5 rounded text-[10px] bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 font-bold">
                          P:{ev.partition} | O:{ev.offset}
                        </span>
                        <span className="text-white font-bold">{ev.district}</span>
                        <span className="text-slate-400 text-[11px]">({ev.state})</span>
                      </div>
                      <div className="flex items-center gap-3">
                        <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                          ev.crime_type === 'MURDER' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' :
                          ev.crime_type === 'ROBBERY' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' :
                          ev.crime_type === 'WOMEN_SAFETY' ? 'bg-fuchsia-500/20 text-fuchsia-400 border border-fuchsia-500/30' :
                          'bg-sky-500/20 text-sky-400 border border-sky-500/30'
                        }`}>
                          {ev.crime_type}
                        </span>
                        <span className="text-slate-300 font-bold">
                          +{ev.incident_count} {ev.incident_count === 1 ? 'incident' : 'incidents'}
                        </span>
                        <span className="text-slate-500 text-[11px]">
                          Sev: {ev.severity_weight}
                        </span>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>
          )}

          {activeTab === "anomalies" && (
            <div className="space-y-3">
              <div className="p-3 rounded-xl bg-slate-800/40 border border-slate-700/60 text-slate-300 text-xs leading-relaxed">
                <span className="font-bold text-white">Statistical Detection Formula: </span>
                Anomalies are flagged whenever rolling incident velocity diverges sharply from historical district baseline: 
                <span className="text-indigo-300 font-mono font-bold"> Z = (Current_Rate - μ) / σ</span>. Events with <span className="text-amber-400 font-bold">Z &gt; 2.5</span> trigger warning alerts, while <span className="text-rose-400 font-bold">Z &gt; 3.0</span> escalate to critical tactical dispatch.
              </div>
              <div className="space-y-2">
                {activeAnomalies.length === 0 ? (
                  <div className="p-6 text-center text-slate-500">No anomalies detected in the current window. Baseline stable.</div>
                ) : (
                  activeAnomalies.map((anom, i) => (
                    <div
                      key={anom.id || i}
                      className={`p-3.5 rounded-xl border flex flex-col sm:flex-row sm:items-center justify-between gap-3 ${
                        anom.severity === "CRITICAL"
                          ? "bg-rose-950/20 border-rose-800/50"
                          : "bg-amber-950/20 border-amber-800/50"
                      }`}
                    >
                      <div className="space-y-1">
                        <div className="flex items-center gap-2">
                          <span className={`px-2 py-0.5 rounded text-[10px] font-black uppercase tracking-wider ${
                            anom.severity === "CRITICAL"
                              ? "bg-rose-500 text-white"
                              : "bg-amber-500 text-navy-950"
                          }`}>
                            {anom.severity} SURGE
                          </span>
                          <span className="font-bold text-white text-sm">
                            {anom.district}, {anom.state}
                          </span>
                          <span className="text-slate-400 text-xs font-mono">@{anom.timestamp}</span>
                        </div>
                        <div className="text-slate-300 text-xs">
                          Spike: <span className="font-bold text-white">{anom.current_rate} incidents/hr</span> vs baseline mean of <span className="font-bold text-slate-400">{anom.baseline_mean}</span>
                        </div>
                      </div>
                      <div className="flex items-center gap-3 shrink-0">
                        <div className="text-right">
                          <div className="text-[10px] text-slate-400 uppercase font-mono">Z-Score</div>
                          <div className={`text-base font-mono font-black ${
                            anom.severity === "CRITICAL" ? "text-rose-400" : "text-amber-400"
                          }`}>
                            +{anom.z_score}σ
                          </div>
                        </div>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>
          )}

          {activeTab === "metrics" && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div className="bg-navy-950 p-4 rounded-xl border border-slate-800 space-y-3">
                <h4 className="font-bold text-white uppercase text-xs">Top Active Ingestion Districts</h4>
                <div className="space-y-2">
                  {topDistricts.length === 0 ? (
                    <div className="text-slate-500">Aggregating district counts...</div>
                  ) : (
                    topDistricts.slice(0, 7).map((d, i) => (
                      <div key={i} className="flex items-center justify-between text-xs py-1 border-b border-slate-900">
                        <span className="text-slate-300 font-medium">{d.district} ({d.state})</span>
                        <span className="font-mono font-bold text-emerald-400">+{d.live_incident_count} events</span>
                      </div>
                    ))
                  )}
                </div>
              </div>

              <div className="bg-navy-950 p-4 rounded-xl border border-slate-800 space-y-3">
                <h4 className="font-bold text-white uppercase text-xs">Crime Category Distribution</h4>
                <div className="space-y-2">
                  {Object.entries(typeBreakdown).length === 0 ? (
                    <div className="text-slate-500">Aggregating category types...</div>
                  ) : (
                    Object.entries(typeBreakdown).map(([ctype, count], i) => (
                      <div key={i} className="flex items-center justify-between text-xs py-1 border-b border-slate-900">
                        <span className="text-slate-300 font-medium">{ctype}</span>
                        <span className="font-mono font-bold text-indigo-400">{count.toLocaleString()}</span>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}
        </div>

        {/* Modal Footer */}
        <div className="px-6 py-3 bg-navy-950 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
          <span>Backend worker <code className="text-slate-300 font-mono">ingestion/live_stream_service.py</code> actively streaming NCRB district vectors.</span>
          <button
            onClick={onClose}
            className="px-4 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-white font-bold transition"
          >
            Close Inspector
          </button>
        </div>
      </div>
    </div>
  );
}

// Mount React Root
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
