version: '3.8'

networks:
  crime-net:
    driver: bridge

volumes:
  hadoop_namenode:
  hadoop_datanode:
  hive_metastore_db:
  airflow_logs:

services:
  # --------------------------------------------------------------------------
  # HDFS NAMENODE & DATANODE
  # --------------------------------------------------------------------------
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: always
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - .:/app
    environment:
      - CLUSTER_NAME=india_crime_cluster
    env_file:
      - ./hadoop.env
    networks:
      - crime-net

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    restart: always
    depends_on:
      - namenode
    ports:
      - "9864:9864"
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870"
    env_file:
      - ./hadoop.env
    networks:
      - crime-net

  # --------------------------------------------------------------------------
  # APACHE SPARK (MASTER + 2 WORKERS)
  # --------------------------------------------------------------------------
  spark-master:
    image: bitnami/spark:3.5.0
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - .:/app
    networks:
      - crime-net

  spark-worker-1:
    image: bitnami/spark:3.5.0
    container_name: spark-worker-1
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    volumes:
      - .:/app
    networks:
      - crime-net

  spark-worker-2:
    image: bitnami/spark:3.5.0
    container_name: spark-worker-2
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    volumes:
      - .:/app
    networks:
      - crime-net

  # --------------------------------------------------------------------------
  # APACHE HIVE (HIVE SERVER 2 / METASTORE)
  # --------------------------------------------------------------------------
  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-server
    restart: always
    ports:
      - "10000:10000"
      - "10002:10002"
    environment:
      HIVE_CORE_CONF_javax_jdo_option_ConnectionURL: "jdbc:postgresql://hive-metastore-db:5432/metastore"
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864"
    depends_on:
      - namenode
      - datanode
    networks:
      - crime-net

  hive-metastore-db:
    image: bde2020/hive-metastore-postgresql:2.3.0
    container_name: hive-metastore-db
    volumes:
      - hive_metastore_db:/var/lib/postgresql/data
    networks:
      - crime-net

  # --------------------------------------------------------------------------
  # APACHE KAFKA & ZOOKEEPER
  # --------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - crime-net

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - crime-net

  # --------------------------------------------------------------------------
  # APACHE AIRFLOW (WEBSERVER & SCHEDULER)
  # --------------------------------------------------------------------------
  airflow-webserver:
    image: apache/airflow:2.7.1-python3.10
    container_name: airflow-webserver
    restart: always
    depends_on:
      - namenode
      - spark-master
    ports:
      - "8085:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=bda_crime_analysis_secret
    volumes:
      - ./airflow:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - .:/app
    command: bash -c "airflow db init && airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin && airflow webserver"
    networks:
      - crime-net

  airflow-scheduler:
    image: apache/airflow:2.7.1-python3.10
    container_name: airflow-scheduler
    restart: always
    depends_on:
      - airflow-webserver
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./airflow:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - .:/app
    command: bash -c "sleep 10 && airflow scheduler"
    networks:
      - crime-net

  # --------------------------------------------------------------------------
  # STREAMLIT DASHBOARD
  # --------------------------------------------------------------------------
  streamlit:
    image: python:3.10-slim
    container_name: streamlit-dashboard
    restart: always
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    working_dir: /app
    command: bash -c "pip install --no-cache-dir -r requirements.txt && streamlit run dashboard/streamlit_app.py --server.port 8501 --server.address 0.0.0.0"
    networks:
      - crime-net
